name: Build & Deploy Skeleton Build

on:
  push:
    branches: [skeleton-build]
    paths:
      - 'src/**'
      - 'docs/mock/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/build-production.yml'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check dist exists
        id: check-dist
        run: |
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            echo "dist_ready=true" >> $GITHUB_OUTPUT
          else
            echo "dist_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH agent
        if: steps.check-dist.outputs.dist_ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add host to known_hosts
        if: steps.check-dist.outputs.dist_ready == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production
        if: steps.check-dist.outputs.dist_ready == 'true'
        run: rsync -avz --delete dist/ ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/var/www/AI_MARKETPLACE/

# ─── Required GitHub Setup ───────────────────────────────────────────────
# Repo → Settings → Secrets and variables → Actions → New repository secret:
#
#   PROD_HOST     — Production server IP/hostname (e.g. 123.123.123.123)
#   PROD_USER     — SSH username for deployment (e.g. ubuntu, ec2-user, deploy)
#   PROD_SSH_KEY  — Private SSH KEY (.pem file content) — paste full file
#                   including BEGIN/END lines:
#                   -----BEGIN RSA PRIVATE KEY-----
#                   ...
#                   -----END RSA PRIVATE KEY-----
#
# Setup steps:
# 1. Copy your .pem file content (cat your-key.pem)
# 2. Add as PROD_SSH_KEY secret in GitHub
# 3. Add PROD_HOST and PROD_USER secrets
# 4. Ensure .pem public key is added to server ~/.ssh/authorized_keys
#    or used as EC2/cloud instance key pair
# 5. Server must have rsync installed:
#      sudo apt install rsync
#
# Self-hosted runner setup:
# Repo → Settings → Actions → Runners → New self-hosted runner
# Follow GitHub instructions for Linux